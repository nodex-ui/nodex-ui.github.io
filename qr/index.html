<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR example</title>
  <meta name="description" content="Generate a QR code and a VietQR payment code with the Nodex UI QR service.">
  <link rel="icon" href="/examples/favicon.ico" sizes="any">
    <link rel="stylesheet" href="/dist/nodexui.min.css">
  <script type="importmap">
  { "imports": { "nodexui/qr": "/dist/nodexui.qr.esm.js" } }
  </script>
</head>
<body class="bg-body text-body">
  <main class="container py-5" style="max-width: 40rem">
    <h1 class="h3 mb-4">QR service</h1>
    <label class="form-label" for="text">Text or URL</label>
    <input class="form-control mb-3" id="text" value="https://ui.thebase.vn">
    <div class="mb-4" id="qr" style="width: 14rem"></div>
    <h2 class="h5">VietQR</h2>
    <div class="row g-2 mb-3">
      <div class="col"><input class="form-control" id="account" value="0123456789" aria-label="Account number"></div>
      <div class="col"><input class="form-control" id="amount" value="50000" aria-label="Amount (VND)"></div>
    </div>
    <div class="mb-2" id="vietqr" style="width: 14rem"></div>
    <code class="d-block small text-break" id="payload"></code>
  </main>
  <script type="module" src="./qr-example.js"></script>
</body>
</html>

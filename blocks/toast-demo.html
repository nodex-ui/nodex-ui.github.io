<!doctype html>
<html lang="en" b-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>toast-demo</title>
    <link rel="stylesheet" href="/dist/nodexui.min.css">
    <script src="/dist/nodexui.min.js" defer></script>
    <script type="module" src="/dist/nodexui.block-viewer.esm.js"></script>
  </head>
  <body class="bg-body text-body" data-block-title="toast-demo" data-block-description="A button that shows a toast notification with a title and description.">
    <div id="b-block-viewer" b-ui="block-viewer"></div>
    <script type="text/xml" b-block-code-template>
<templates>
  <t t-name="examples.SidebarBlock">
    <div b-block="toast-demo" class="d-flex align-items-center justify-content-center min-vh-100 bg-body-tertiary p-4">
      <div style="max-width: 28rem" class="d-flex flex-column align-items-center gap-3 w-100">
        <Button variant="'outline'" onClick="() => state.open = true">Show Toast</Button>
        <Toast open="state.open" onOpenChange="(v) => state.open = v" className="'w-100'">
          <div class="d-flex flex-column">
            <span class="fw-medium">Event created</span>
            <span class="text-body-secondary small">Sunday, December 3 at 9:00 AM</span>
          </div>
          <t t-set-slot="action">
            <Button variant="'outline'" size="'sm'" onClick="() => state.open = false">Undo</Button>
          </t>
        </Toast>
      </div>
    </div>
  </t>
</templates>
    </script>
  </body>
</html>

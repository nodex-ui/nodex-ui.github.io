<!doctype html>
<html lang="en" b-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>button-demo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/nodexui@1.3.1/dist/nodexui.min.css">
    <script src="https://cdn.jsdelivr.net/npm/nodexui@1.3.1/dist/nodexui.min.js" defer></script>
    <script type="module" src="/block-viewer.esm.js"></script>
  </head>
  <body class="bg-body text-body" data-block-title="button-demo" data-block-description="A default button with a leading icon, plus size, icon, and loading-state variants.">
    <div id="b-block-viewer" b-ui="block-viewer"></div>
    <script type="text/xml" b-block-code-template>
<templates>
  <t t-name="examples.SidebarBlock">
    <div b-block="button-demo" class="d-flex align-items-center justify-content-center min-vh-100 bg-body-tertiary p-4">
      <div class="d-flex flex-column gap-4" style="max-width: 28rem">
        <Button icon="'arrow-up'" label="'Button'"/>

        <div class="d-flex flex-wrap align-items-center gap-2">
          <Button size="'xs'" label="'Extra Small'"/>
          <Button size="'sm'" label="'Small'"/>
          <Button label="'Default'"/>
          <Button size="'lg'" label="'Large'"/>
        </div>

        <div class="d-flex flex-wrap align-items-center gap-2">
          <Button icon="'git-branch'" label="'New Branch'"/>
          <Button icon="'git-fork'" label="'Fork'"/>
        </div>

        <div class="d-flex flex-wrap align-items-center gap-2">
          <Button disabled="true">
            <Spinner className="'me-2'"/>Generating
          </Button>
          <Button disabled="true">
            <Spinner className="'me-2'"/>Downloading
          </Button>
        </div>
      </div>
    </div>
  </t>
</templates>
    </script>
  </body>
</html>

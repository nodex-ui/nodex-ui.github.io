<!doctype html>
<html lang="en" b-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>skeleton-demo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/nodexui@1.3.1/dist/nodexui.min.css">
    <script src="https://cdn.jsdelivr.net/npm/nodexui@1.3.1/dist/nodexui.min.js" defer></script>
    <script type="module" src="/block-viewer.esm.js"></script>
  </head>
  <body class="bg-body text-body" data-block-title="skeleton-demo" data-block-description="A circular avatar skeleton paired with two stacked text-line skeletons showing a loading placeholder state.">
    <div id="b-block-viewer" b-ui="block-viewer"></div>
    <script type="text/xml" b-block-code-template>
<templates>
  <t t-name="examples.SidebarBlock">
    <div b-block="skeleton-demo" class="d-flex align-items-center justify-content-center min-vh-100 bg-body-tertiary p-4">
      <div class="d-flex align-items-center gap-3" style="max-width: 28rem">
        <div style="width: 3rem">
          <Skeleton shape="'circle'"/>
        </div>
        <div class="d-flex flex-column gap-2">
          <div style="width: 250px">
            <Skeleton/>
          </div>
          <div style="width: 200px">
            <Skeleton/>
          </div>
        </div>
      </div>
    </div>
  </t>
</templates>
    </script>
  </body>
</html>

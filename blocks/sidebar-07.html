<!doctype html>
<html lang="en" b-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>sidebar-07</title>
    <link rel="stylesheet" href="/dist/nodexui.min.css">
    <script src="/dist/nodexui.min.js" defer></script>
    <script type="module" src="/dist/nodexui.block-viewer.esm.js"></script>
  </head>
  <body class="bg-body text-body" data-block-title="sidebar-07" data-block-description="A simple sidebar with navigation grouped by section.">
    <div id="b-block-viewer" b-ui="block-viewer"></div>
    <script type="text/xml" b-block-code-template>
<templates>
  <t t-name="examples.SidebarBlock">
    <div b-block="sidebar-07">
      <Shell className="'b-block-shell'" collapsed="state.collapsed" onCollapsedChange="(value) => { state.collapsed = value; }">
        <ShellSidebar className="'b-block-sidebar'">
          <a href="#" b-block-brand=""><span b-block-mark=""><Icon name="'gallery-vertical-end'"/></span>Acme Inc.</a>
          <nav b-block-nav="" aria-label="Main">
            <SidebarMenu>
              <SidebarMenuItem><SidebarMenuButton href="'#'" icon="'square-terminal'" active="true">Playground</SidebarMenuButton></SidebarMenuItem>
              <SidebarMenuItem><SidebarMenuButton href="'#'" icon="'bot'">Models</SidebarMenuButton></SidebarMenuItem>
              <SidebarMenuItem><SidebarMenuButton href="'#'" icon="'book-open'">Documentation</SidebarMenuButton></SidebarMenuItem>
            </SidebarMenu>
          </nav>
        </ShellSidebar>
        <ShellMain className="'b-block-main'">
          <ShellHeader className="'b-block-header'">
            <SidebarTrigger/>
            <div b-block-muted="">Build Your Application / Data Fetching</div>
          </ShellHeader>
          <ShellContent className="'b-block-content'">
            <div b-block-placeholders="">
              <div b-block-placeholder=""></div>
              <div b-block-placeholder=""></div>
              <div b-block-placeholder=""></div>
            </div>
            <div b-block-canvas=""></div>
          </ShellContent>
        </ShellMain>
      </Shell>
    </div>
  </t>
</templates>
    </script>
  </body>
</html>

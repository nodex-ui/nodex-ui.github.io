<!doctype html>
<html lang="en" b-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>badge-demo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/nodexui@1.3.1/dist/nodexui.min.css">
    <script src="https://cdn.jsdelivr.net/npm/nodexui@1.3.1/dist/nodexui.min.js" defer></script>
    <script type="module" src="/block-viewer.esm.js"></script>
  </head>
  <body class="bg-body text-body" data-block-title="badge-demo" data-block-description="Four core badge variants shown side by side.">
    <div id="b-block-viewer" b-ui="block-viewer"></div>
    <script type="text/xml" b-block-code-template>
<templates>
  <t t-name="examples.SidebarBlock">
    <div b-block="badge-demo" class="d-flex align-items-center justify-content-center min-vh-100 bg-body-tertiary p-4">
      <div class="d-flex gap-2" style="max-width: 28rem">
        <Badge variant="'primary'">Default</Badge>
        <Badge variant="'secondary'">Secondary</Badge>
        <Badge variant="'danger'">Destructive</Badge>
        <Badge variant="'muted'">Outline</Badge>
      </div>
    </div>
  </t>
</templates>
    </script>
  </body>
</html>

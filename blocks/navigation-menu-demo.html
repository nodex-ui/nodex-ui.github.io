<!doctype html>
<html lang="en" b-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>navigation-menu-demo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/nodexui@1.3.1/dist/nodexui.min.css">
    <script src="https://cdn.jsdelivr.net/npm/nodexui@1.3.1/dist/nodexui.min.js" defer></script>
    <script type="module" src="/block-viewer.esm.js"></script>
  </head>
  <body class="bg-body text-body" data-block-title="navigation-menu-demo" data-block-description="A horizontal navigation menu with roving-focus links for Home, Components, Docs, List, Simple, and With Icon.">
    <div id="b-block-viewer" b-ui="block-viewer"></div>
    <script type="text/xml" b-block-code-template>
<templates>
  <t t-name="examples.SidebarBlock">
    <div b-block="navigation-menu-demo" class="d-flex align-items-center justify-content-center min-vh-100 bg-body-tertiary p-4">
      <div style="max-width: 40rem" class="w-100">
        <NavigationMenu>
          <NavigationMenuItem href="'#home'">Home</NavigationMenuItem>
          <NavigationMenuItem href="'#components'">Components</NavigationMenuItem>
          <NavigationMenuItem href="'/docs'">Docs</NavigationMenuItem>
          <NavigationMenuItem href="'#list'">List</NavigationMenuItem>
          <NavigationMenuItem href="'#simple'">Simple</NavigationMenuItem>
          <NavigationMenuItem href="'#with-icon'">With Icon</NavigationMenuItem>
        </NavigationMenu>
      </div>
    </div>
  </t>
</templates>
    </script>
  </body>
</html>

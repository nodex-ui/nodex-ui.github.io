<!doctype html>
<html lang="en" b-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>resizable-demo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/nodexui@1.3.1/dist/nodexui.min.css">
    <script src="https://cdn.jsdelivr.net/npm/nodexui@1.3.1/dist/nodexui.min.js" defer></script>
    <script type="module" src="/block-viewer.esm.js"></script>
  </head>
  <body class="bg-body text-body" data-block-title="resizable-demo" data-block-description="Accessible resizable panels arranged horizontally that users can drag to resize.">
    <div id="b-block-viewer" b-ui="block-viewer"></div>
    <script type="text/xml" b-block-code-template>
<templates>
  <t t-name="examples.SidebarBlock">
    <div b-block="resizable-demo" class="d-flex align-items-center justify-content-center min-vh-100 bg-body-tertiary p-4">
      <div class="d-flex border rounded-3" style="max-width: 28rem; width: 100%;">
        <Resizable min="80" max="300" className="'flex-shrink-0 border-end'">
          <div class="d-flex align-items-center justify-content-center h-100 p-3">
            <span class="fw-semibold">One</span>
          </div>
        </Resizable>
        <Resizable min="80" max="300" className="'flex-shrink-0 border-end'">
          <div class="d-flex align-items-center justify-content-center h-100 p-3">
            <span class="fw-semibold">Two</span>
          </div>
        </Resizable>
        <div class="flex-grow-1">
          <div class="d-flex align-items-center justify-content-center h-100 p-3">
            <span class="fw-semibold">Three</span>
          </div>
        </div>
      </div>
    </div>
  </t>
</templates>
    </script>
  </body>
</html>

<!doctype html>
<html lang="en" b-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>toggle-demo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/nodexui@1.3.1/dist/nodexui.min.css">
    <script src="https://cdn.jsdelivr.net/npm/nodexui@1.3.1/dist/nodexui.min.js" defer></script>
    <script type="module" src="/block-viewer.esm.js"></script>
  </head>
  <body class="bg-body text-body" data-block-title="toggle-demo" data-block-description="A two-state button that can be toggled on or off, shown in its default, outline, with-text, and disabled forms.">
    <div id="b-block-viewer" b-ui="block-viewer"></div>
    <script type="text/xml" b-block-code-template>
<templates>
  <t t-name="examples.SidebarBlock">
    <div b-block="toggle-demo" class="d-flex align-items-center justify-content-center min-vh-100 bg-body-tertiary p-4">
      <div class="d-flex flex-column gap-4" style="max-width: 28rem">
        <div class="d-flex align-items-center gap-2">
          <Toggle>Toggle</Toggle>
        </div>
        <div class="d-flex align-items-center gap-2">
          <Toggle variant="'outline'"><Icon name="'italic'"/></Toggle>
          <Toggle variant="'outline'"><Icon name="'bold'"/></Toggle>
        </div>
        <div class="d-flex align-items-center gap-2">
          <Toggle><Icon name="'italic'"/> Italic</Toggle>
        </div>
        <div class="d-flex align-items-center gap-2">
          <Toggle className="'disabled'" pressed="false"><Icon name="'italic'"/></Toggle>
        </div>
      </div>
    </div>
  </t>
</templates>
    </script>
  </body>
</html>

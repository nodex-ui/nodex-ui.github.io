<!doctype html>
<html lang="en" b-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>qr-card-demo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/nodexui@1.3.1/dist/nodexui.min.css">
    <script src="https://cdn.jsdelivr.net/npm/nodexui@1.3.1/dist/nodexui.min.js" defer></script>
    <script type="module" src="/block-viewer.esm.js"></script>
  </head>
  <body class="bg-body text-body" data-block-title="qr-card-demo" data-block-description="A card with a scannable QR code, a title and a description.">
    <div id="b-block-viewer" b-ui="block-viewer"></div>
    <script type="text/xml" b-block-code-template>
<templates>
  <t t-name="examples.SidebarBlock">
    <div b-block="qr-card-demo" class="d-flex align-items-center justify-content-center min-vh-100 bg-body-tertiary p-4">
      <!-- qrContent is the string encoded into the QR code; for custom error correction pass matrix="..." from qrMatrix() in nodexui/qr instead. -->
      <QRCard
        style="'max-width: 24rem'"
        qrContent="'https://nodex-ui.github.io'"
        label="'Connect device QR code'"
        title="'Scan to connect your mobile device'"
        description="'Open the Ledger mobile app and scan this code to link your device.'"/>
    </div>
  </t>
</templates>
    </script>
  </body>
</html>

<!doctype html>
<html lang="en" b-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>chart-demo</title>
    <link rel="stylesheet" href="/dist/nodexui.min.css">
    <script src="/dist/nodexui.min.js" defer></script>
    <script type="module" src="/dist/nodexui.block-viewer.esm.js"></script>
  </head>
  <body class="bg-body text-body" data-block-title="chart-demo" data-block-description="A bar chart comparing desktop and mobile visitors across three months, with hover tooltips and a series legend.">
    <div id="b-block-viewer" b-ui="block-viewer"></div>
    <script type="text/xml" b-block-code-template>
<templates>
  <t t-name="examples.SidebarBlock">
    <div b-block="chart-demo" class="d-flex align-items-center justify-content-center min-vh-100 bg-body-tertiary p-4">
      <div style="max-width: 32rem" class="w-100">
        <Chart type="'bar'" className="'w-100'" aria-label="'Bar chart of desktop and mobile visitors'">
          <div b-chart-header="">
            <h3 b-chart-title="">Bar Chart</h3>
            <p b-chart-description="">Desktop and mobile visitors for January - March</p>
          </div>
          <div b-chart-body="">
            <div b-chart-plot="">
              <div class="d-flex align-items-end gap-1" title="January">
                <div b-att-value="186" b-att-label="Desktop"></div>
                <div b-att-value="80" b-att-label="Mobile"></div>
              </div>
              <div class="d-flex align-items-end gap-1" title="February">
                <div b-att-value="305" b-att-label="Desktop"></div>
                <div b-att-value="200" b-att-label="Mobile"></div>
              </div>
              <div class="d-flex align-items-end gap-1" title="March">
                <div b-att-value="237" b-att-label="Desktop"></div>
                <div b-att-value="120" b-att-label="Mobile"></div>
              </div>
            </div>
          </div>
          <div b-chart-footer="">
            <div b-chart-legend="">
              <span style="--b-chart-color: var(--b-chart-1)">Desktop</span>
              <span style="--b-chart-color: var(--b-chart-2)">Mobile</span>
            </div>
          </div>
        </Chart>
      </div>
    </div>
  </t>
</templates>
    </script>
  </body>
</html>

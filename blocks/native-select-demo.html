<!doctype html>
<html lang="en" b-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>native-select-demo</title>
    <link rel="stylesheet" href="/dist/nodexui.min.css">
    <script src="/dist/nodexui.min.js" defer></script>
    <script type="module" src="/dist/nodexui.block-viewer.esm.js"></script>
  </head>
  <body class="bg-body text-body" data-block-title="native-select-demo" data-block-description="A styled native HTML select element for choosing a fruit from a list of options">
    <div id="b-block-viewer" b-ui="block-viewer"></div>
    <script type="text/xml" b-block-code-template>
<templates>
  <t t-name="examples.SidebarBlock">
    <div b-block="native-select-demo" class="d-flex align-items-center justify-content-center min-vh-100 bg-body-tertiary p-4">
      <div class="d-grid w-100 gap-2" style="max-width: 24rem">
        <NativeSelect label="'Fruit'">
          <option value="'apple'">Apple</option>
          <option value="'banana'">Banana</option>
          <option value="'blueberry'">Blueberry</option>
          <option value="'pineapple'">Pineapple</option>
        </NativeSelect>
        <NativeSelect label="'Fruit'" supportingText="'Shown on your order'" useTip="1">
          <option value="'apple'">Apple</option>
          <option value="'banana'">Banana</option>
        </NativeSelect>
      </div>
    </div>
  </t>
</templates>
    </script>
  </body>
</html>

<!doctype html>
<html lang="en" b-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>separator-demo</title>
    <link rel="stylesheet" href="/dist/nodexui.min.css">
    <script src="/dist/nodexui.min.js" defer></script>
    <script type="module" src="/dist/nodexui.block-viewer.esm.js"></script>
  </head>
  <body class="bg-body text-body" data-block-title="separator-demo" data-block-description="A horizontal separator under a heading, plus vertical separators dividing inline links.">
    <div id="b-block-viewer" b-ui="block-viewer"></div>
    <script type="text/xml" b-block-code-template>
<templates>
  <t t-name="examples.SidebarBlock">
    <div b-block="separator-demo" class="d-flex align-items-center justify-content-center min-vh-100 bg-body-tertiary p-4">
      <div style="max-width: 28rem" class="w-100">
        <div class="mb-1">
          <Typography as="'h4'" variant="'small'" className="'fw-medium mb-0'">Radix Primitives</Typography>
          <Typography as="'p'" variant="'small'" className="'text-muted-foreground mb-0'">An open-source UI component library.</Typography>
        </div>
        <Separator className="'my-4'"/>
        <div class="d-flex align-items-center gap-3 small" style="height: 1.25rem">
          <div>Blog</div>
          <Separator orientation="'vertical'"/>
          <div>Docs</div>
          <Separator orientation="'vertical'"/>
          <div>Source</div>
        </div>
      </div>
    </div>
  </t>
</templates>
    </script>
  </body>
</html>

<!doctype html>
<html lang="en" b-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>text-editor-demo</title>
    <link rel="stylesheet" href="/dist/nodexui.min.css">
    <script src="/dist/nodexui.min.js" defer></script>
    <script type="module" src="/dist/nodexui.block-viewer.esm.js"></script>
  </head>
  <body class="bg-body text-body" data-block-title="text-editor-demo" data-block-description="A Milkdown-backed WYSIWYG rich text editor with a formatting toolbar for bold, italic, headings, lists, quotes, and links.">
    <div id="b-block-viewer" b-ui="block-viewer"></div>
    <script type="text/xml" b-block-code-template>
<templates>
  <t t-name="examples.SidebarBlock">
    <div b-block="text-editor-demo" class="d-flex align-items-center justify-content-center min-vh-100 bg-body-tertiary p-4">
      <div style="max-width: 40rem; height: 32rem" class="w-100">
        <TextEditor
          content="'&lt;h1&gt;Draft&lt;/h1&gt;&lt;p&gt;Edit &lt;strong&gt;rich text&lt;/strong&gt; here.&lt;/p&gt;'"
          placeholder="'Write something...'"
        />
      </div>
    </div>
  </t>
</templates>
    </script>
  </body>
</html>

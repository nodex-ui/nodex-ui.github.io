<!doctype html>
<html lang="en" b-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>textarea-demo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/nodexui@1.3.1/dist/nodexui.min.css">
    <script src="https://cdn.jsdelivr.net/npm/nodexui@1.3.1/dist/nodexui.min.js" defer></script>
    <script type="module" src="/block-viewer.esm.js"></script>
  </head>
  <body class="bg-body text-body" data-block-title="textarea-demo" data-block-description="A plain multiline textarea for typing a message, alongside labeled, helper-text, disabled, and submit-button variants.">
    <div id="b-block-viewer" b-ui="block-viewer"></div>
    <script type="text/xml" b-block-code-template>
<templates>
  <t t-name="examples.SidebarBlock">
    <div b-block="textarea-demo" class="d-flex align-items-center justify-content-center min-vh-100 bg-body-tertiary p-4">
      <div class="d-flex flex-column gap-4" style="max-width: 28rem; width: 100%">
        <Textarea label="'Message'"/>

        <Textarea label="'Your message'" placeholder="'Type your message here.'" id="'message'"/>

        <Textarea label="'Your message'" supportingText="'Your message will be copied to the support team.'" maxLength="200"/>

        <Textarea label="'Your message'" supportingText="'Copied to the support team'" useTip="1"/>

        <Textarea label="'Message'" rows="3">
          <t t-set-slot="footer"><span>0/280</span><Button size="'xs'">Send</Button></t>
        </Textarea>

        <Textarea label="'Your message'" errorText="'Message is required'"/>

        <div class="d-grid gap-2">
          <Textarea placeholder="'Type your message here.'"/>
          <Button>Send message</Button>
        </div>

        <Textarea label="'Disabled'" placeholder="'Type your message here.'" disabled="true"/>
      </div>
    </div>
  </t>
</templates>
    </script>
  </body>
</html>

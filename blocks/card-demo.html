<!doctype html>
<html lang="en" b-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>card-demo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/nodexui@1.3.1/dist/nodexui.min.css">
    <script src="https://cdn.jsdelivr.net/npm/nodexui@1.3.1/dist/nodexui.min.js" defer></script>
    <script type="module" src="/block-viewer.esm.js"></script>
  </head>
  <body class="bg-body text-body" data-block-title="card-demo" data-block-description="A login form card with header, email/password fields, and a submit button.">
    <div id="b-block-viewer" b-ui="block-viewer"></div>
    <script type="text/xml" b-block-code-template>
<templates>
  <t t-name="examples.SidebarBlock">
    <div b-block="card-demo" class="d-flex align-items-center justify-content-center min-vh-100 bg-body-tertiary p-4">
      <div style="max-width: 24rem" class="w-100">
        <Card>
          <CardHeader>
            <CardTitle>Login to your account</CardTitle>
            <CardDescription>Enter your email below to login to your account</CardDescription>
          </CardHeader>
          <CardBody>
            <div class="d-flex flex-column gap-3">
              <div class="d-flex flex-column gap-2">
                <Label htmlFor="'email'">Email</Label>
                <Input id="'email'" type="'email'" placeholder="'m@example.com'"/>
              </div>
              <div class="d-flex flex-column gap-2">
                <Label htmlFor="'password'">Password</Label>
                <Input id="'password'" type="'password'"/>
              </div>
            </div>
          </CardBody>
          <CardFooter className="'d-flex flex-column'">
            <Button className="'w-100'">Login</Button>
          </CardFooter>
        </Card>
      </div>
    </div>
  </t>
</templates>
    </script>
  </body>
</html>

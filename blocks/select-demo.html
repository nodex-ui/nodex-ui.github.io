<!doctype html>
<html lang="en" b-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>select-demo</title>
    <link rel="stylesheet" href="/dist/nodexui.min.css">
    <script src="/dist/nodexui.min.js" defer></script>
    <script type="module" src="/dist/nodexui.block-viewer.esm.js"></script>
  </head>
  <body class="bg-body text-body" data-block-title="select-demo" data-block-description="A basic select dropdown that lets the user pick a theme from a list of options.">
    <div id="b-block-viewer" b-ui="block-viewer"></div>
    <script type="text/xml" b-block-code-template>
<templates>
  <t t-name="examples.SidebarBlock">
    <div b-block="select-demo" class="d-flex align-items-center justify-content-center min-vh-100 bg-body-tertiary p-4">
      <div style="max-width: 240px" class="d-flex flex-column gap-4">
        <Select label="'Theme'" value="'dark'">
          <SelectTrigger>Dark</SelectTrigger>
          <SelectContent>
            <SelectItem value="'light'">Light</SelectItem>
            <SelectItem value="'dark'">Dark</SelectItem>
            <SelectItem value="'system'">System</SelectItem>
          </SelectContent>
        </Select>
        <Select label="'Theme'" value="'dark'" supportingText="'Applies to this device only'" useTip="1">
          <SelectTrigger>Dark</SelectTrigger>
          <SelectContent>
            <SelectItem value="'light'">Light</SelectItem>
            <SelectItem value="'dark'">Dark</SelectItem>
          </SelectContent>
        </Select>
      </div>
    </div>
  </t>
</templates>
    </script>
  </body>
</html>

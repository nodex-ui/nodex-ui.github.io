<!doctype html>
<html lang="en" b-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>collapsible-demo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/nodexui@1.3.1/dist/nodexui.min.css">
    <script src="https://cdn.jsdelivr.net/npm/nodexui@1.3.1/dist/nodexui.min.js" defer></script>
    <script type="module" src="/block-viewer.esm.js"></script>
  </head>
  <body class="bg-body text-body" data-block-title="collapsible-demo" data-block-description="A collapsible element that toggles visibility of order details when the trigger is clicked.">
    <div id="b-block-viewer" b-ui="block-viewer"></div>
    <script type="text/xml" b-block-code-template>
<templates>
  <t t-name="examples.SidebarBlock">
    <div b-block="collapsible-demo" class="d-flex align-items-center justify-content-center min-vh-100 bg-body-tertiary p-4">
      <div style="max-width: 28rem" class="w-100">
        <Collapsible>
          <CollapsibleTrigger>Toggle details</CollapsibleTrigger>
          <CollapsibleContent>
            <div>Status: Shipped</div>
          </CollapsibleContent>
        </Collapsible>
      </div>
    </div>
  </t>
</templates>
    </script>
  </body>
</html>

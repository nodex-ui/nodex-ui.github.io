<!doctype html>
<html lang="en" b-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>combobox-demo</title>
    <link rel="stylesheet" href="/dist/nodexui.min.css">
    <script src="/dist/nodexui.min.js" defer></script>
    <script type="module" src="/dist/nodexui.block-viewer.esm.js"></script>
  </head>
  <body class="bg-body text-body" data-block-title="combobox-demo" data-block-description="A searchable dropdown that filters a list of framework options as the user types.">
    <div id="b-block-viewer" b-ui="block-viewer"></div>
    <script type="text/xml" b-block-code-template>
<templates>
  <t t-name="examples.SidebarBlock">
    <div b-block="combobox-demo" class="d-flex align-items-center justify-content-center min-vh-100 bg-body-tertiary p-4">
      <div style="max-width: 28rem" class="w-100 d-flex flex-column gap-4">
        <Combobox options="[
          { value: 'nextjs', label: 'Next.js' },
          { value: 'sveltekit', label: 'SvelteKit' },
          { value: 'nuxtjs', label: 'Nuxt.js' },
          { value: 'remix', label: 'Remix' },
          { value: 'astro', label: 'Astro' },
        ]" label="'Framework'" placeholder="'Select a framework'"/>
        <Combobox options="[
          { value: 'nextjs', label: 'Next.js' },
          { value: 'remix', label: 'Remix' },
        ]" label="'Framework'" supportingText="'Pick the one you use most'" useTip="1"/>
      </div>
    </div>
  </t>
</templates>
    </script>
  </body>
</html>

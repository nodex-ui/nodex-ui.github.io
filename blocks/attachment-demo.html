<!doctype html>
<html lang="en" b-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>attachment-demo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/nodexui@1.3.1/dist/nodexui.min.css">
    <script src="https://cdn.jsdelivr.net/npm/nodexui@1.3.1/dist/nodexui.min.js" defer></script>
    <script type="module" src="/block-viewer.esm.js"></script>
  </head>
  <body class="bg-body text-body" data-block-title="attachment-demo" data-block-description="A group of image attachments alongside individual attachment cards showing uploading and file states with remove actions.">
    <div id="b-block-viewer" b-ui="block-viewer"></div>
    <script type="text/xml" b-block-code-template>
<templates>
  <t t-name="examples.SidebarBlock">
    <div b-block="attachment-demo" class="d-flex align-items-center justify-content-center min-vh-100 bg-body-tertiary p-4">
      <div class="d-grid gap-3" style="max-width: 28rem; width: 100%">
        <AttachmentGroup className="'d-flex gap-3 overflow-auto pb-2'">
          <Attachment state="'done'" size="'sm'" orientation="'vertical'">
            <AttachmentMedia variant="'image'">
              <img src="https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&amp;fit=crop&amp;w=240&amp;q=80" alt="Workspace" class="w-100 h-100 object-fit-cover"/>
            </AttachmentMedia>
            <AttachmentContent>
              <AttachmentTitle>workspace.png</AttachmentTitle>
              <AttachmentDescription>PNG · 820 KB</AttachmentDescription>
            </AttachmentContent>
          </Attachment>
          <Attachment state="'done'" size="'sm'" orientation="'vertical'">
            <AttachmentMedia variant="'image'">
              <img src="https://images.unsplash.com/photo-1497366811353-6870744d04b2?auto=format&amp;fit=crop&amp;w=240&amp;q=80" alt="Desk" class="w-100 h-100 object-fit-cover"/>
            </AttachmentMedia>
            <AttachmentContent>
              <AttachmentTitle>desk-reference.jpg</AttachmentTitle>
              <AttachmentDescription>JPG · 1.1 MB</AttachmentDescription>
            </AttachmentContent>
          </Attachment>
          <Attachment state="'done'" size="'sm'" orientation="'vertical'">
            <AttachmentMedia variant="'image'">
              <img src="https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&amp;fit=crop&amp;w=240&amp;q=80" alt="Office" class="w-100 h-100 object-fit-cover"/>
            </AttachmentMedia>
            <AttachmentContent>
              <AttachmentTitle>office-reference.jpg</AttachmentTitle>
              <AttachmentDescription>JPG · 940 KB</AttachmentDescription>
            </AttachmentContent>
          </Attachment>
        </AttachmentGroup>
        <div class="d-grid gap-3">
          <Attachment state="'uploading'" className="'w-100'">
            <AttachmentMedia>
              <Icon name="'refresh-cw'"/>
            </AttachmentMedia>
            <AttachmentContent>
              <AttachmentTitle>sales-dashboard.pdf</AttachmentTitle>
              <AttachmentDescription>Uploading · 64%</AttachmentDescription>
            </AttachmentContent>
            <AttachmentActions>
              <AttachmentAction aria-label="'Remove sales-dashboard.pdf'">
                <Icon name="'x'"/>
              </AttachmentAction>
            </AttachmentActions>
          </Attachment>
          <Attachment state="'done'" className="'w-100'">
            <AttachmentMedia>
              <Icon name="'file-code'"/>
            </AttachmentMedia>
            <AttachmentContent>
              <AttachmentTitle>message-renderer.tsx</AttachmentTitle>
              <AttachmentDescription>TypeScript · 12 KB</AttachmentDescription>
            </AttachmentContent>
            <AttachmentActions>
              <AttachmentAction aria-label="'Remove message-renderer.tsx'">
                <Icon name="'x'"/>
              </AttachmentAction>
            </AttachmentActions>
            <AttachmentTrigger aria-label="'Open message-renderer.tsx'"/>
          </Attachment>
        </div>
      </div>
    </div>
  </t>
</templates>
    </script>
  </body>
</html>

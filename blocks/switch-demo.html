<!doctype html>
<html lang="en" b-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>switch-demo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/nodexui@1.3.1/dist/nodexui.min.css">
    <script src="https://cdn.jsdelivr.net/npm/nodexui@1.3.1/dist/nodexui.min.js" defer></script>
    <script type="module" src="/block-viewer.esm.js"></script>
  </head>
  <body class="bg-body text-body" data-block-title="switch-demo" data-block-description="A switch paired with a label that toggles between checked and unchecked states, such as an Airplane Mode control.">
    <div id="b-block-viewer" b-ui="block-viewer"></div>
    <script type="text/xml" b-block-code-template>
<templates>
  <t t-name="examples.SidebarBlock">
    <div b-block="switch-demo" class="d-flex align-items-center justify-content-center min-vh-100 bg-body-tertiary p-4">
      <div class="d-flex flex-column gap-3" style="max-width: 28rem">
        <Switch>Airplane Mode</Switch>
        <Switch supportingText="'Turns off all wireless radios'">Airplane Mode</Switch>
        <Switch supportingText="'Turns off all wireless radios'" useTip="1">Airplane Mode</Switch>
      </div>
    </div>
  </t>
</templates>
    </script>
  </body>
</html>

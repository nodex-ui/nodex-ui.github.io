<!doctype html>
<html lang="en" b-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>popover-demo</title>
    <link rel="stylesheet" href="/dist/nodexui.min.css">
    <script src="/dist/nodexui.min.js" defer></script>
    <script type="module" src="/dist/nodexui.block-viewer.esm.js"></script>
  </head>
  <body class="bg-body text-body" data-block-title="popover-demo" data-block-description="A popover that reveals rich title and description content in a floating panel when its trigger button is clicked.">
    <div id="b-block-viewer" b-ui="block-viewer"></div>
    <script type="text/xml" b-block-code-template>
<templates>
  <t t-name="examples.SidebarBlock">
    <div b-block="popover-demo" class="d-flex align-items-center justify-content-center min-vh-100 bg-body-tertiary p-4">
      <div style="max-width: 28rem">
        <Popover>
          <PopoverTrigger>
            <Button variant="'outline'">Open Popover</Button>
          </PopoverTrigger>
          <PopoverContent>
            <div class="d-flex flex-column gap-1">
              <Typography variant="'h4'">Title</Typography>
              <Typography variant="'muted'">Description text here.</Typography>
            </div>
          </PopoverContent>
        </Popover>
      </div>
    </div>
  </t>
</templates>
    </script>
  </body>
</html>

<!doctype html>
<html lang="en" b-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>input-demo</title>
    <link rel="stylesheet" href="/dist/nodexui.min.css">
    <script src="/dist/nodexui.min.js" defer></script>
    <script type="module" src="/dist/nodexui.block-viewer.esm.js"></script>
  </head>
  <body class="bg-body text-body" data-block-title="input-demo" data-block-description="A simple text input for forms and user data entry with built-in styling and accessibility features.">
    <div id="b-block-viewer" b-ui="block-viewer"></div>
    <script type="text/xml" b-block-code-template>
<templates>
  <t t-name="examples.SidebarBlock">
    <div b-block="input-demo" class="d-flex align-items-center justify-content-center min-vh-100 bg-body-tertiary p-4">
      <div style="max-width: 28rem" class="w-100 d-flex flex-column gap-4">
        <Input type="'email'" placeholder="'Email'"/>
        <Input label="'Email'" supportingText="'We only use it to send receipts'" useTip="1" leadingIcon="'mail'"/>
        <Input label="'Website'" placeholder="'example.com'">
          <t t-set-slot="start"><span>https://</span></t>
        </Input>
        <Input label="'Search'">
          <t t-set-slot="end"><Button size="'xs'">Search</Button></t>
        </Input>
      </div>
    </div>
  </t>
</templates>
    </script>
  </body>
</html>

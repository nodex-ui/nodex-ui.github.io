<!doctype html>
<html lang="en" b-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>empty-demo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/nodexui@1.3.1/dist/nodexui.min.css">
    <script src="https://cdn.jsdelivr.net/npm/nodexui@1.3.1/dist/nodexui.min.js" defer></script>
    <script type="module" src="/block-viewer.esm.js"></script>
  </head>
  <body class="bg-body text-body" data-block-title="empty-demo" data-block-description="An empty state with an icon, title, description, and two actions for when a user has no projects yet.">
    <div id="b-block-viewer" b-ui="block-viewer"></div>
    <script type="text/xml" b-block-code-template>
<templates>
  <t t-name="examples.SidebarBlock">
    <div b-block="empty-demo" class="d-flex align-items-center justify-content-center min-vh-100 bg-body-tertiary p-4">
      <div style="max-width: 28rem" class="w-100">
        <Empty>
          <EmptyHeader>
            <EmptyMedia variant="'icon'">
              <Icon name="'folder-code'"/>
            </EmptyMedia>
            <EmptyTitle>No Projects Yet</EmptyTitle>
            <EmptyDescription>You haven't created any projects yet. Get started by creating your first project.</EmptyDescription>
          </EmptyHeader>
          <EmptyContent>
            <div class="d-flex gap-2">
              <Button label="'Create Project'"/>
              <Button variant="'outline'" label="'Import Project'"/>
            </div>
          </EmptyContent>
        </Empty>
      </div>
    </div>
  </t>
</templates>
    </script>
  </body>
</html>

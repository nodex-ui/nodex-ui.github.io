<!doctype html>
<html lang="en" b-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>sidebar-11</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/nodexui@1.3.1/dist/nodexui.min.css">
    <script src="https://cdn.jsdelivr.net/npm/nodexui@1.3.1/dist/nodexui.min.js" defer></script>
    <script type="module" src="/block-viewer.esm.js"></script>
  </head>
  <body class="bg-body text-body" data-block-title="sidebar-11" data-block-description="A file explorer sidebar with changes and project files.">
    <div id="b-block-viewer" b-ui="block-viewer"></div>
    <script type="text/xml" b-block-code-template>
<templates>
  <t t-name="examples.SidebarBlock">
    <div b-block="sidebar-11">
      <Shell className="'b-block-shell'" collapsed="state.collapsed" onCollapsedChange="(value) => { state.collapsed = value; }">

        <ShellMain className="'b-block-main'">
          <ShellHeader className="'b-block-header'">
            <SidebarTrigger/>
            <Separator orientation="'vertical'"/>
            <Breadcrumb>
                <BreadcrumbList>
                    <BreadcrumbItem><a class="b-breadcrumb-link" href="#">Build Your Application</a></BreadcrumbItem>
                    <BreadcrumbSeparator/>
                    <BreadcrumbItem><BreadcrumbPage>button.tsx</BreadcrumbPage></BreadcrumbItem>
                </BreadcrumbList>
                </Breadcrumb>
          </ShellHeader>
          <ShellContent className="'b-block-content'">
            <div b-block-file-shell="">
              <section b-block-file-panel=""><h2>Changes</h2><a href="#"><Icon name="'file-text'" className="'b-block-icon'"/>README.md <span>M</span></a><a href="#"><Icon name="'file-code'" className="'b-block-icon'"/>api/hello/route.ts <span>U</span></a><a href="#"><Icon name="'layout'" className="'b-block-icon'"/>app/layout.tsx <span>M</span></a></section>
              <section b-block-file-panel=""><h2>Files</h2><a href="#"><Icon name="'folder'" className="'b-block-icon'"/>app</a><a href="#"><Icon name="'folder-open'" className="'b-block-icon'"/>components</a><a href="#" aria-current="page"><Icon name="'file-code'" className="'b-block-icon'"/>button.tsx</a><a href="#"><Icon name="'file-code'" className="'b-block-icon'"/>card.tsx</a><a href="#"><Icon name="'folder'" className="'b-block-icon'"/>lib</a><a href="#"><Icon name="'folder'" className="'b-block-icon'"/>public</a></section>
            </div>
          </ShellContent>
        </ShellMain>

      </Shell>
    </div>
  </t>
</templates>
    </script>
  </body>
</html>

<!doctype html>
<html lang="en" b-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>alert-demo</title>
    <link rel="stylesheet" href="/dist/nodexui.min.css">
    <script src="/dist/nodexui.min.js" defer></script>
    <script type="module" src="/dist/nodexui.block-viewer.esm.js"></script>
  </head>
  <body class="bg-body text-body" data-block-title="alert-demo" data-block-description="Callouts for user attention showing a success message and an informational message, each paired with an icon, title, and description.">
    <div id="b-block-viewer" b-ui="block-viewer"></div>
    <script type="text/xml" b-block-code-template>
<templates>
  <t t-name="examples.SidebarBlock">
    <div b-block="alert-demo" class="d-flex align-items-center justify-content-center min-vh-100 bg-body-tertiary p-4">
      <div class="d-flex flex-column gap-3 w-100" style="max-width: 28rem">
        <Alert>
          <Icon name="'circle-check-big'"/>
          <AlertTitle>Payment successful</AlertTitle>
          <AlertDescription>Your payment of $29.99 has been processed. A receipt has been sent to your email address.</AlertDescription>
        </Alert>
        <Alert>
          <Icon name="'info'"/>
          <AlertTitle>New feature available</AlertTitle>
          <AlertDescription>We've added dark mode support. You can enable it in your account settings.</AlertDescription>
        </Alert>
      </div>
    </div>
  </t>
</templates>
    </script>
  </body>
</html>

<!doctype html>
<html lang="en" b-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>radio-group-demo</title>
    <link rel="stylesheet" href="/dist/nodexui.min.css">
    <script src="/dist/nodexui.min.js" defer></script>
    <script type="module" src="/dist/nodexui.block-viewer.esm.js"></script>
  </head>
  <body class="bg-body text-body" data-block-title="radio-group-demo" data-block-description="A basic radio group where a user can select one option from multiple choices, with the first option selected by default.">
    <div id="b-block-viewer" b-ui="block-viewer"></div>
    <script type="text/xml" b-block-code-template>
<templates>
  <t t-name="examples.SidebarBlock">
    <div b-block="radio-group-demo" class="d-flex align-items-center justify-content-center min-vh-100 bg-body-tertiary p-4">
      <div style="max-width: 28rem" class="w-100">
        <RadioGroup value="'option-one'" className="'d-flex flex-column gap-2'">
          <RadioGroupItem value="'option-one'">Option One</RadioGroupItem>
          <RadioGroupItem value="'option-two'">Option Two</RadioGroupItem>
        </RadioGroup>
      </div>
    </div>
  </t>
</templates>
    </script>
  </body>
</html>

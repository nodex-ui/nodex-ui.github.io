<!doctype html>
<html lang="en" b-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>item-demo</title>
    <link rel="stylesheet" href="/dist/nodexui.min.css">
    <script src="/dist/nodexui.min.js" defer></script>
    <script type="module" src="/dist/nodexui.block-viewer.esm.js"></script>
  </head>
  <body class="bg-body text-body" data-block-title="item-demo" data-block-description="A verified-profile item with a title and action button, plus a grouped list of contact items.">
    <div id="b-block-viewer" b-ui="block-viewer"></div>
    <script type="text/xml" b-block-code-template>
<templates>
  <t t-name="examples.SidebarBlock">
    <div b-block="item-demo" class="d-flex align-items-center justify-content-center min-vh-100 bg-body-tertiary p-4">
      <div class="d-flex flex-column gap-4 w-100" style="max-width: 28rem">
        <Item variant="'outline'">
          <span b-item-media="'icon'">
            <Icon name="'badge-check'"/>
          </span>
          <span b-item-content="">
            <strong b-item-title="">Your profile has been verified.</strong>
          </span>
          <span b-item-actions="">
            <Button variant="'ghost'" size="'sm'">
              <Icon name="'chevron-right'"/>
            </Button>
          </span>
        </Item>

        <div b-item-group="">
          <Item>
            <span b-item-media="">JD</span>
            <span b-item-content="">
              <strong b-item-title="">John Doe</strong>
              <span b-item-description="">john.doe@example.com</span>
            </span>
          </Item>
          <div b-item-separator=""></div>
          <Item>
            <span b-item-media="">AS</span>
            <span b-item-content="">
              <strong b-item-title="">Alice Smith</strong>
              <span b-item-description="">alice.smith@example.com</span>
            </span>
          </Item>
          <div b-item-separator=""></div>
          <Item>
            <span b-item-media="">RB</span>
            <span b-item-content="">
              <strong b-item-title="">Robert Brown</strong>
              <span b-item-description="">robert.brown@example.com</span>
            </span>
          </Item>
        </div>
      </div>
    </div>
  </t>
</templates>
    </script>
  </body>
</html>

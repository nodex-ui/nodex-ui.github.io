<!doctype html>
<html lang="en" b-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>toggle-group-demo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/nodexui@1.3.1/dist/nodexui.min.css">
    <script src="https://cdn.jsdelivr.net/npm/nodexui@1.3.1/dist/nodexui.min.js" defer></script>
    <script type="module" src="/block-viewer.esm.js"></script>
  </head>
  <body class="bg-body text-body" data-block-title="toggle-group-demo" data-block-description="A single-select toggle group for text formatting with bold, italic, and underline options.">
    <div id="b-block-viewer" b-ui="block-viewer"></div>
    <script type="text/xml" b-block-code-template>
<templates>
  <t t-name="examples.SidebarBlock">
    <div b-block="toggle-group-demo" class="d-flex align-items-center justify-content-center min-vh-100 bg-body-tertiary p-4">
      <div style="max-width: 28rem">
        <ToggleGroup>
          <ToggleGroupItem value="'bold'">
            <Icon name="'bold'" className="'h-4 w-4'"/>
          </ToggleGroupItem>
          <ToggleGroupItem value="'italic'">
            <Icon name="'italic'" className="'h-4 w-4'"/>
          </ToggleGroupItem>
          <ToggleGroupItem value="'underline'">
            <Icon name="'underline'" className="'h-4 w-4'"/>
          </ToggleGroupItem>
        </ToggleGroup>
      </div>
    </div>
  </t>
</templates>
    </script>
  </body>
</html>

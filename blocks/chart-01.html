<!doctype html>
<html lang="en" b-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>chart-01</title>
    <link rel="stylesheet" href="/dist/nodexui.min.css">
    <script src="/dist/nodexui.min.js" defer></script>
    <script type="module" src="/dist/nodexui.block-viewer.esm.js"></script>
  </head>
  <body class="bg-body text-body" data-block-title="chart-01" data-block-description="A copyable usage block showing how to compose the Nodex UI chart component.">
    <div id="b-block-viewer" b-ui="block-viewer"></div>
    <script type="text/xml" b-block-code-template>
<templates>
  <t t-name="examples.SidebarBlock">
    <section b-block="chart-01" class="bg-body-tertiary min-vh-100 p-3 p-lg-4">
      <div class="d-grid gap-4 mx-auto" style="max-width: 72rem">
        <div class="d-grid gap-2" style="max-width: 42rem">
          <Badge variant="'muted'">Chart usage</Badge>
          <h1 class="h3 mb-0 fw-semibold">Build a chart with the pure Nodex UI Chart component</h1>
          <p class="text-body-secondary small mb-0">Import <code>Chart</code> from <code>nodexui</code>, compose shadcn-style card slots, and draw with SVG chart-token primitives to build a chart card with no framework-specific rendering code.</p>
        </div>
        <div class="row g-4 align-items-start">
          <aside class="col-12 col-lg-4">
            <Card>
              <CardBody>
                <h2 class="h6 mb-3 fw-semibold">How to use it</h2>
                <ol class="d-grid gap-3 ps-0 mb-3" style="list-style: none">
                  <li class="d-flex gap-2">
                    <Badge variant="'secondary'">1</Badge>
                    <span class="d-grid">
                      <strong>Add the chart root</strong>
                      <span class="text-body-secondary small">Import <code>Chart</code> from <code>nodexui</code>, then render <code>&lt;Chart type="'area'" variant="'area-card'"&gt;</code>.</span>
                    </span>
                  </li>
                  <li class="d-flex gap-2">
                    <Badge variant="'secondary'">2</Badge>
                    <span class="d-grid">
                      <strong>Compose the card slots</strong>
                      <span class="text-body-secondary small">Add <code>b-chart-header</code>, <code>b-chart-body</code>, and <code>b-chart-footer</code> inside the default slot for shadcn card spacing.</span>
                    </span>
                  </li>
                  <li class="d-flex gap-2">
                    <Badge variant="'secondary'">3</Badge>
                    <span class="d-grid">
                      <strong>Draw with chart primitives</strong>
                      <span class="text-body-secondary small">Use <code>b-chart-grid</code>, <code>b-chart-area</code>, <code>b-chart-line</code>, and <code>b-chart-axis</code> inside your SVG, and the <code>Icon</code> component for inline glyphs.</span>
                    </span>
                  </li>
                </ol>
                <div class="d-flex flex-wrap gap-2" aria-label="Chart tokens">
                  <Badge variant="'secondary'"><code>--b-chart-1</code></Badge>
                  <Badge variant="'secondary'"><code>--b-chart-2</code></Badge>
                  <Badge variant="'secondary'"><code>--b-chart-height</code></Badge>
                </div>
              </CardBody>
            </Card>
          </aside>
          <div class="col-12 col-lg-8 d-grid gap-3">
            <Chart type="'area'" variant="'area-card'">
              <div b-chart-header="">
                <h3 b-chart-title="">Area Chart</h3>
                <p b-chart-description="">Showing total visitors for the last 6 months</p>
              </div>
              <div b-chart-body="">
                <svg viewBox="0 0 640 250" role="img" aria-label="Area Chart">
                  <defs>
                    <linearGradient id="chart01Area" x1="0" y1="0" x2="0" y2="1">
                      <stop offset="5%" stop-color="var(--b-chart-1)" stop-opacity="0.8"/>
                      <stop offset="95%" stop-color="var(--b-chart-1)" stop-opacity="0.1"/>
                    </linearGradient>
                  </defs>
                  <g b-chart-grid="">
                    <line x1="0" y1="40" x2="640" y2="40"/>
                    <line x1="0" y1="100" x2="640" y2="100"/>
                    <line x1="0" y1="160" x2="640" y2="160"/>
                  </g>
                  <path b-chart-area="" b-chart-series="" fill="url(#chart01Area)" d="M0 158 C80 70 160 112 240 58 S400 176 480 98 S590 54 640 76 L640 220 L0 220 Z"/>
                  <path b-chart-line="" b-chart-series="" d="M0 158 C80 70 160 112 240 58 S400 176 480 98 S590 54 640 76"/>
                  <g b-chart-axis="">
                    <text x="0" y="245">Jan</text>
                    <text x="128" y="245">Feb</text>
                    <text x="256" y="245">Mar</text>
                    <text x="384" y="245">Apr</text>
                    <text x="512" y="245">May</text>
                    <text x="610" y="245">Jun</text>
                  </g>
                </svg>
              </div>
              <div b-chart-footer="">
                <div b-chart-trend="">Trending up by 5.2% this month <Icon name="'trending-up'" size="'1rem'"/></div>
                <div b-chart-range="">January - June 2024</div>
              </div>
            </Chart>
            <p class="text-body-secondary small text-center mb-0">Paste this block into any page that loads Nodex UI CSS and the pure Nodex UI component bundle.</p>
          </div>
        </div>
      </div>
    </section>
  </t>
</templates>
    </script>
  </body>
</html>

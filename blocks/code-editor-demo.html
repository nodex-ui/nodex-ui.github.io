<!doctype html>
<html lang="en" b-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>code-editor-demo</title>
    <link rel="stylesheet" href="/dist/nodexui.min.css">
    <script src="/dist/nodexui.min.js" defer></script>
    <script type="module" src="/dist/nodexui.block-viewer.esm.js"></script>
  </head>
  <body class="bg-body text-body" data-block-title="code-editor-demo" data-block-description="Shows code with line numbers and syntax colouring for the language named by codeLang, using the CodeEditor component.">
    <div id="b-block-viewer" b-ui="block-viewer"></div>
    <script type="text/xml" b-block-code-template>
<templates>
  <t t-name="examples.SidebarBlock">
    <div b-block="code-editor-demo" class="d-flex align-items-center justify-content-center min-vh-100 bg-body-tertiary p-4">
      <div style="max-width: 40rem" class="w-100">
        <Tabs defaultValue="'go'">
          <TabsList variant="'line'">
            <TabTrigger value="'go'">Go</TabTrigger>
            <TabTrigger value="'c'">C</TabTrigger>
            <TabTrigger value="'java'">Java</TabTrigger>
            <TabTrigger value="'javascript'">JavaScript</TabTrigger>
            <TabTrigger value="'html'">HTML</TabTrigger>
            <TabTrigger value="'xml'">XML</TabTrigger>
            <TabTrigger value="'json'">JSON</TabTrigger>
            <TabTrigger value="'css'">CSS</TabTrigger>
            <TabTrigger value="'sql'">SQL</TabTrigger>
            <TabTrigger value="'file'">Open file</TabTrigger>
          </TabsList>
          <TabsContainer>
            <TabContent value="'go'">
              <div class="p-3">
                <CodeEditor title="'main.go'" codeLang="'go'" value="'package main\n\nimport \'fmt\'\n\n// Greets the world.\nfunc main() {\n\tfmt.Println(\'hello\', 42)\n}'"/>
              </div>
            </TabContent>
            <TabContent value="'c'">
              <div class="p-3">
                <CodeEditor title="'main.c'" codeLang="'c'" value="'#include &lt;stdio.h&gt;\n\n/* Greets the world. */\nint main(void) {\n  printf(\'hello %d\\n\', 42);\n  return 0;\n}'"/>
              </div>
            </TabContent>
            <TabContent value="'java'">
              <div class="p-3">
                <CodeEditor title="'Main.java'" codeLang="'java'" value="'public class Main {\n  // Greets the world.\n  public static void main(String[] args) {\n    System.out.println(\'hello \' + 42);\n  }\n}'"/>
              </div>
            </TabContent>
            <TabContent value="'javascript'">
              <div class="p-3">
                <CodeEditor title="'main.js'" codeLang="'js'" value="'// Greets the world.\nconst greet = (name) => `hello ${name}`;\nconsole.log(greet(\'world\'), 42);'"/>
              </div>
            </TabContent>
            <TabContent value="'html'">
              <div class="p-3">
                <CodeEditor title="'index.html'" codeLang="'html'" value="'&lt;!DOCTYPE html&gt;\n&lt;html lang=\'en\'&gt;\n  &lt;head&gt;\n    &lt;meta charset=\'utf-8\'&gt;\n    &lt;title&gt;Hello &amp;amp; welcome&lt;/title&gt;\n    &lt;link rel=\'stylesheet\' href=\'/app.css\'&gt;\n  &lt;/head&gt;\n  &lt;body class=\'bg-light\'&gt;\n    &lt;!-- Greeting --&gt;\n    &lt;h1 id=\'title\' hidden&gt;Hello&lt;/h1&gt;\n    &lt;img src=\'logo.png\' alt=\'Logo\'/&gt;\n  &lt;/body&gt;\n&lt;/html&gt;'"/>
              </div>
            </TabContent>
            <TabContent value="'xml'">
              <div class="p-3">
                <CodeEditor title="'pom.xml'" codeLang="'xml'" value="'&lt;?xml version=\'1.0\' encoding=\'UTF-8\'?&gt;\n&lt;project xmlns=\'http://maven.apache.org/POM/4.0.0\' xmlns:xsi=\'http://www.w3.org/2001/XMLSchema-instance\'&gt;\n  &lt;!-- Build settings --&gt;\n  &lt;modelVersion&gt;4.0.0&lt;/modelVersion&gt;\n  &lt;artifactId&gt;demo &amp;amp; co&lt;/artifactId&gt;\n  &lt;dependency scope=\'test\'/&gt;\n&lt;/project&gt;'"/>
              </div>
            </TabContent>
            <TabContent value="'json'">
              <div class="p-3">
                <CodeEditor title="'package.json'" codeLang="'json'" value="'{\n  &quot;name&quot;: &quot;demo&quot;,\n  &quot;version&quot;: 1.2,\n  &quot;private&quot;: true,\n  &quot;tags&quot;: [&quot;ui&quot;, null]\n}'"/>
              </div>
            </TabContent>
            <TabContent value="'css'">
              <div class="p-3">
                <CodeEditor title="'app.css'" codeLang="'css'" value="'/* Card */\n.card:hover {\n  color: #0d6efd;\n  margin-top: 4px;\n  background: var(--bs-body-bg);\n}'"/>
              </div>
            </TabContent>
            <TabContent value="'sql'">
              <div class="p-3">
                <CodeEditor title="'users.sql'" codeLang="'sql'" value="'SELECT id, name -- who\nFROM users\nWHERE active = true\nLIMIT 10;'"/>
              </div>
            </TabContent>
            <TabContent value="'file'">
              <div class="p-3">
                <CodeEditor upload="true" src="'/src/components/code-editor/code-editor.behavior.js'" title="'Loaded from a URL; Open file loads your own'"/>
              </div>
            </TabContent>
          </TabsContainer>
        </Tabs>
      </div>
    </div>
  </t>
</templates>
    </script>
  </body>
</html>

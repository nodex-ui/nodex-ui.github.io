<!doctype html>
<html lang="en" b-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>direction-demo</title>
    <link rel="stylesheet" href="/dist/nodexui.min.css">
    <script src="/dist/nodexui.min.js" defer></script>
    <script type="module" src="/dist/nodexui.block-viewer.esm.js"></script>
  </head>
  <body class="bg-body text-body" data-block-title="direction-demo" data-block-description="A login form rendered right-to-left in Arabic to demonstrate the Direction component mirroring layout and text direction.">
    <div id="b-block-viewer" b-ui="block-viewer"></div>
    <script type="text/xml" b-block-code-template>
<templates>
  <t t-name="examples.SidebarBlock">
    <div b-block="direction-demo" class="d-flex align-items-center justify-content-center min-vh-100 bg-body-tertiary p-4">
      <div style="max-width: 26rem" class="w-100">
        <Direction dir="'rtl'" className="'w-100'">
          <Card className="'w-100'">
            <CardHeader>
              <div class="d-flex align-items-center justify-content-between mb-2">
                <Select defaultValue="'ar'">
                  <SelectTrigger className="'w-auto'">Arabic (العربية)</SelectTrigger>
                  <SelectContent>
                    <SelectItem value="'en'">English</SelectItem>
                    <SelectItem value="'ar'">Arabic (العربية)</SelectItem>
                  </SelectContent>
                </Select>
              </div>
              <CardTitle>تسجيل الدخول إلى حسابك</CardTitle>
              <CardDescription>أدخل بريدك الإلكتروني أدناه لتسجيل الدخول إلى حسابك</CardDescription>
            </CardHeader>
            <CardBody>
              <div class="d-flex flex-column gap-3">
                <Field>
                  <FieldLabel>البريد الإلكتروني</FieldLabel>
                  <Input type="'email'" placeholder="'m@example.com'"/>
                </Field>
                <Field>
                  <div class="d-flex align-items-center justify-content-between">
                    <FieldLabel>كلمة المرور</FieldLabel>
                    <a href="#" class="small text-decoration-underline">نسيت كلمة المرور؟</a>
                  </div>
                  <Input type="'password'"/>
                </Field>
                <Button className="'w-100'">تسجيل الدخول</Button>
                <Button variant="'outline'" className="'w-100'" icon="'globe'">تسجيل الدخول باستخدام Google</Button>
              </div>
              <p class="text-center small mb-0 mt-3">ليس لديك حساب؟ <a href="#" class="text-decoration-underline">إنشاء حساب</a></p>
            </CardBody>
          </Card>
        </Direction>
      </div>
    </div>
  </t>
</templates>
    </script>
  </body>
</html>

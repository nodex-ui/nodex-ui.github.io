<!doctype html>
<html lang="en" b-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>bubble-demo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/nodexui@1.3.1/dist/nodexui.min.css">
    <script src="https://cdn.jsdelivr.net/npm/nodexui@1.3.1/dist/nodexui.min.js" defer></script>
    <script type="module" src="/block-viewer.esm.js"></script>
  </head>
  <body class="bg-body text-body" data-block-title="bubble-demo" data-block-description="A conversational thread of chat bubbles that groups messages, switches sides, and attaches reactions.">
    <div id="b-block-viewer" b-ui="block-viewer"></div>
    <script type="text/xml" b-block-code-template>
<templates>
  <t t-name="examples.SidebarBlock">
    <div b-block="bubble-demo" class="d-flex align-items-center justify-content-center min-vh-100 bg-body-tertiary p-4">
      <div class="d-flex flex-column gap-3 w-100" style="max-width: 28rem">
        <div class="d-flex justify-content-start">
          <Bubble>Hey there! what's up?</Bubble>
        </div>
        <div class="d-flex justify-content-end">
          <Bubble side="'outgoing'">Hey! Want to see chat bubbles?</Bubble>
        </div>
        <div class="d-flex flex-column align-items-start gap-1">
          <Bubble>I can group messages, switch sides, and keep the whole thread easy to scan.</Bubble>
          <div class="d-flex gap-1">
            <Badge variant="'outline'" pill="true">👍</Badge>
          </div>
        </div>
        <div class="d-flex justify-content-end">
          <Bubble side="'outgoing'">Sure. Hit me with your best demo.</Bubble>
        </div>
        <div class="d-flex flex-column align-items-start gap-1">
          <Bubble>Yes. You are reading a demo that is demoing itself. Very meta. Very on-brand.</Bubble>
          <div class="d-flex gap-1">
            <Badge variant="'outline'" pill="true">👍</Badge>
            <Badge variant="'outline'" pill="true">🔥</Badge>
            <Badge variant="'outline'" pill="true">👀</Badge>
            <Badge variant="'outline'" pill="true">+2</Badge>
          </div>
        </div>
      </div>
    </div>
  </t>
</templates>
    </script>
  </body>
</html>

<!doctype html>
<html lang="en" b-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>kbd-demo</title>
    <link rel="stylesheet" href="/dist/nodexui.min.css">
    <script src="/dist/nodexui.min.js" defer></script>
    <script type="module" src="/dist/nodexui.block-viewer.esm.js"></script>
  </head>
  <body class="bg-body text-body" data-block-title="kbd-demo" data-block-description="Displays keyboard shortcut keys, individually or grouped into combinations, using the Kbd component.">
    <div id="b-block-viewer" b-ui="block-viewer"></div>
    <script type="text/xml" b-block-code-template>
<templates>
  <t t-name="examples.SidebarBlock">
    <div b-block="kbd-demo" class="d-flex align-items-center justify-content-center min-vh-100 bg-body-tertiary p-4">
      <div style="max-width: 28rem" class="d-flex flex-column align-items-center gap-4 w-100">
        <div class="d-flex align-items-center gap-1">
          <Kbd>⌘</Kbd>
          <Kbd>⇧</Kbd>
          <Kbd>⌥</Kbd>
          <Kbd>⌃</Kbd>
        </div>
        <p class="text-body-secondary small text-center mb-0">
          Use <Kbd>⌘</Kbd><Kbd>V</Kbd> to paste text.
        </p>
        <Button variant="'outline'">
          <t t-set-slot="default">
            Accept <Kbd className="'ms-2'">⏎ Enter</Kbd>
          </t>
        </Button>
        <Input label="'Search'" className="'w-100'">
          <t t-set-slot="end"><Kbd>⌘K</Kbd></t>
        </Input>
      </div>
    </div>
  </t>
</templates>
    </script>
  </body>
</html>

<!doctype html>
<html lang="en" b-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>pagination-demo</title>
    <link rel="stylesheet" href="/dist/nodexui.min.css">
    <script src="/dist/nodexui.min.js" defer></script>
    <script type="module" src="/dist/nodexui.block-viewer.esm.js"></script>
  </head>
  <body class="bg-body text-body" data-block-title="pagination-demo" data-block-description="A pagination component with previous/next navigation, numbered page links, an ellipsis indicator, and an active page.">
    <div id="b-block-viewer" b-ui="block-viewer"></div>
    <script type="text/xml" b-block-code-template>
<templates>
  <t t-name="examples.SidebarBlock">
    <div b-block="pagination-demo" class="d-flex align-items-center justify-content-center min-vh-100 bg-body-tertiary p-4">
      <div style="max-width: 28rem" class="w-100">
        <Pagination>
          <PaginationItem>
            <Icon name="'chevron-left'"/>
            <span class="ms-1">Previous</span>
          </PaginationItem>
          <PaginationItem>1</PaginationItem>
          <PaginationItem current="true">2</PaginationItem>
          <PaginationItem>3</PaginationItem>
          <PaginationItem disabled="true">...</PaginationItem>
          <PaginationItem>
            <span class="me-1">Next</span>
            <Icon name="'chevron-right'"/>
          </PaginationItem>
        </Pagination>
      </div>
    </div>
  </t>
</templates>
    </script>
  </body>
</html>

<!doctype html>
<html lang="en" b-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>sheet-demo</title>
    <link rel="stylesheet" href="/dist/nodexui.min.css">
    <script src="/dist/nodexui.min.js" defer></script>
    <script type="module" src="/dist/nodexui.block-viewer.esm.js"></script>
  </head>
  <body class="bg-body text-body" data-block-title="sheet-demo" data-block-description="An offcanvas sheet that slides in from the edge of the screen with a title, description, and close action.">
    <div id="b-block-viewer" b-ui="block-viewer"></div>
    <script type="text/xml" b-block-code-template>
<templates>
  <t t-name="examples.SidebarBlock">
    <div b-block="sheet-demo" class="d-flex align-items-center justify-content-center min-vh-100 bg-body-tertiary p-4">
      <div style="max-width: 28rem" class="w-100">
        <Sheet>
          <SheetTrigger>Open</SheetTrigger>
          <SheetContent>
            <SheetHeader>
              <SheetTitle>Are you absolutely sure?</SheetTitle>
              <SheetDescription>This action cannot be undone.</SheetDescription>
            </SheetHeader>
            <SheetFooter>
              <SheetClose>Close</SheetClose>
            </SheetFooter>
          </SheetContent>
        </Sheet>
      </div>
    </div>
  </t>
</templates>
    </script>
  </body>
</html>

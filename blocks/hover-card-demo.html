<!doctype html>
<html lang="en" b-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>hover-card-demo</title>
    <link rel="stylesheet" href="/dist/nodexui.min.css">
    <script src="/dist/nodexui.min.js" defer></script>
    <script type="module" src="/dist/nodexui.block-viewer.esm.js"></script>
  </head>
  <body class="bg-body text-body" data-block-title="hover-card-demo" data-block-description="An avatar and bio card that appears when hovering over a linked username.">
    <div id="b-block-viewer" b-ui="block-viewer"></div>
    <script type="text/xml" b-block-code-template>
<templates>
  <t t-name="examples.SidebarBlock">
    <div b-block="hover-card-demo" class="d-flex align-items-center justify-content-center min-vh-100 bg-body-tertiary p-4">
      <div style="max-width: 28rem">
        <HoverCard>
          <HoverCardTrigger>
            <a href="https://thebase.vn" class="text-decoration-underline">@thebase</a>
          </HoverCardTrigger>
          <HoverCardContent className="'w-auto'">
            <div class="d-flex justify-content-between gap-3" style="width: 20rem">
              <div class="d-flex flex-column gap-1" style="min-width: 0">
                <h4 class="small fw-semibold mb-0">@thebase</h4>
                <p class="small mb-0">The React Framework – created and maintained by @vercel.</p>
                <div class="d-flex align-items-center pt-2">
                  <span class="small text-muted">Joined December 2021</span>
                </div>
              </div>
            </div>
          </HoverCardContent>
        </HoverCard>
      </div>
    </div>
  </t>
</templates>
    </script>
  </body>
</html>

  <body class="bg-body text-body" data-block-title="sidebar-09" data-block-description="A mail sidebar with an inbox message list.">

<templates>

      <Shell className="'b-block-shell'" collapsed="state.collapsed" onCollapsedChange="(value) => { state.collapsed = value; }">

                </BreadcrumbList>
                </Breadcrumb>
          </ShellHeader>
          <ShellContent className="'b-block-content'">
            <div b-block-mail="">
              <section b-block-mail-list="">

                <div b-block-search=""><Icon name="'search'"/><Input type="'search'" placeholder="'Type to search...'"/></div>

              </section>
              <section b-block-message=""><h2>Meeting Tomorrow</h2><p>Hi team, just a reminder about our meeting tomorrow at 10 AM. Please come prepared with your project updates.</p></section>

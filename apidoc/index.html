<!doctype html>
<html lang="en" b-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenAPI Documentation Component Demo (ApiDoc) | Nodex UI</title>
  <meta name="description" content="Live demo of the Nodex UI ApiDoc component rendering the Swagger Petstore OpenAPI 3.0 spec as interactive API documentation, loaded from a CDN with no build step.">
  <link rel="canonical" href="https://nodex-ui.github.io/apidoc/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Nodex UI">
  <meta property="og:title" content="OpenAPI Documentation Component Demo (ApiDoc) | Nodex UI">
  <meta property="og:description" content="Live demo of the Nodex UI ApiDoc component rendering the Swagger Petstore OpenAPI 3.0 spec as interactive API documentation.">
  <meta property="og:url" content="https://nodex-ui.github.io/apidoc/">
  <meta property="og:image" content="https://nodex-ui.github.io/pwa/logo/light/pwa/icon-512.png">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" type="image/svg+xml" href="/pwa/logo/nodexui-logo-square-light.svg" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/svg+xml" href="/pwa/logo/nodexui-logo-square-dark.svg" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="/pwa/logo/light/ios/AppIcon-180-iphone@3x.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/nodexui@1.3.1/dist/nodexui.min.css" />
  <style>
    .apidoc-bar { display: flex; flex-wrap: wrap; align-items: center; gap: .75rem; padding: .5rem 1rem; border-bottom: 1px solid var(--bs-border-color); }
    .apidoc-bar a { text-decoration: none; }
    .apidoc-bar a[aria-current="page"] { font-weight: 600; }
  </style>
</head>
<body class="bg-body text-body">
  <nav class="apidoc-bar" aria-label="ApiDoc samples">
    <a class="fw-semibold" href="/index.html#/docs">Nodex UI</a>
    <span class="text-body-secondary">Standalone ApiDoc sample:</span>
    <a href="?spec=petstore" data-spec="petstore">Swagger Petstore (OpenAPI 3.0, from petstore3.swagger.io)</a>
    <a href="?spec=basehub" data-spec="basehub">Base HUB aliases (OpenAPI 3.1, large)</a>
  </nav>

  <!-- Standalone ApiDoc: nodexui.apidoc.min.js (from the nodexui npm package) embeds Owl and ApiDoc's templates, so no nodexui.min.js,
       templates file or b-ui markup is needed. Bootstrap's JS is still required (Authorize dialog), and
       nodexui.min.css above styles the page. -->
  <div id="docs"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/nodexui@1.3.1/dist/nodexui.apidoc.min.js"></script>
  <script>
    // Picks the sample from ?spec= and points Try It at this origin when the sample has no live server.
    const spec = new URLSearchParams(location.search).get("spec") === "basehub" ? "basehub" : "petstore";
    document.querySelector(`[data-spec="${spec}"]`).setAttribute("aria-current", "page");
    window.thebase.apidoc.mountApiDoc("#docs", {
      src: spec === "basehub" ? "/src/components/apidoc/open_apidoc.json" : "./openapi.json",
      serverUrl: spec === "basehub" ? location.origin : undefined,
      hash: true,
      themeToggle: true,
      height: "calc(100vh - 3.25rem)",
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>i18n example</title>
  <meta name="description" content="Translate a page with the Nodex UI i18n service.">
  <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="stylesheet" href="/dist/nodexui.min.css">
  <script type="importmap">
  { "imports": { "nodexui/i18n": "/dist/nodexui.i18n.esm.js" } }
  </script>
</head>
<body class="bg-body text-body">
  <main class="container py-5" style="max-width: 40rem">
    <label class="form-label" id="language-label" for="language"></label>
    <select class="form-select mb-4" id="language"></select>
    <h1 id="title"></h1>
    <p id="greeting"></p>
    <p id="count"></p>
    <button class="btn btn-primary" id="more" type="button"></button>
  </main>
  <script type="module" src="./i18n-example.js"></script>
</body>
</html>
